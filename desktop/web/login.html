<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor Mix · Acceso</title><style>:root{color-scheme:dark;font:16px system-ui;background:#171c24;color:#d9e2ec}body{margin:0;padding:24px}main{max-width:420px;margin:10vh auto;background:#252e3a;padding:24px;border:1px solid #4f6276;border-radius:8px}input,button{font:inherit;box-sizing:border-box;width:100%;min-height:48px;padding:12px;margin-top:12px;background:#161e29;color:inherit;border:1px solid #60778e;border-radius:4px}button{background:#315c69}p{line-height:1.5;color:#a8bfce}</style><main><h1>Monitor Mix</h1><p id="description">Acceso protegido</p><form><label>Contraseña<input type="password" id="password" required autocomplete="current-password"></label><button>Entrar</button></form><p id="error" role="alert"></p></main><script>const scope='__SCOPE__';document.querySelector('#description').textContent=scope==='console'?'Consola completa · acceso del operador':scope==='listen'?'Escucha de mezclas':'Control de mezclas auxiliares';document.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/login/'+scope,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const v=await r.json();if(!r.ok)throw Error(v.error);location.href=scope==='console'?'/console/':'/';}catch(e){document.querySelector('#error').textContent=e.message;}};</script></html>
