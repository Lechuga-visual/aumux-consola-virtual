[package]
name = "aumux"
version = "0.14.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "Real-time audio mixer with ASIO, auxiliary monitoring and VST3 hosting"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.3"
crossbeam-queue = "0.3"
pbkdf2 = "0.12"
sha2 = "0.10"
if-addrs = "0.13"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
soundcraft-dsp = { git = "https://github.com/storytold/soundcraft", rev = "cf0f4d2f6a2629b48a1dfbed858ac8c5f227bc42" }
soundcraft-vst3-host = { git = "https://github.com/storytold/soundcraft", rev = "cf0f4d2f6a2629b48a1dfbed858ac8c5f227bc42" }

soundcraft-audio-io = { git = "https://github.com/storytold/soundcraft", rev = "cf0f4d2f6a2629b48a1dfbed858ac8c5f227bc42" }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 2
codegen-units = 8

[patch.crates-io]
# Keep-alive worker reservation fix; see vendor/tiny-http/ORIGIN.md.
tiny_http = { path = "vendor/tiny-http" }
